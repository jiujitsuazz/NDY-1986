<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Close detail of 350 GSM brushed cotton fabric weave</title>
  <defs>
    <pattern id="weave" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#101010"/>
      <path d="M0 10 H20 M10 0 V20" stroke="#1c1c1c" stroke-width="3"/>
      <path d="M0 0 L20 20 M20 0 L0 20" stroke="#161616" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#weave)"/>
  <rect width="400" height="400" fill="url(#vig)"/>
</svg>
